[project]
name = "effekt"
version = "0.1.0"
description = "Generative image effects (bloom, film grain, stroke painting) rendered with cairo"
readme = "README.md"
requires-python = ">=3.12"
license = "CC-BY-NC-3.0"
authors = [{ name = "Lasse Nielsen" }]
dependencies = [
    "pycairo>=1.27",
    "numpy>=2.0",
    "pillow>=11.0",
]

[project.scripts]
effekt = "effekt.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
# tmp/ holds unported legacy code.
extend-exclude = ["tmp"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PTH", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# Frozen parameter dataclasses are safe as argument defaults.
extend-immutable-calls = [
    "effekt.bloom.BloomParams",
    "effekt.colours_natural.ColoursParams",
    "effekt.ebs.EbsParams",
    "effekt.quant.QuantParams",
    "effekt.regrain.RegrainParams",
]
